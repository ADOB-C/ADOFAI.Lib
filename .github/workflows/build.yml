name: Build

on:
  push:
    branches: [main, master]
    paths-ignore:            # 纯文档不可能弄坏构建
      - '**.md'
      - 'PLAN.md'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 同一分支连续推送时，旧的 run 已经没人看了 —— 直接取消
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 主力矩阵放在最便宜的平台上：ARCHIVE 与 BUNDLE_DEPS 的四种组合都在这里跑，
  # 另外两平台只跑默认配置（平台性风险主要在编译/链接，不在选项组合）。
  linux:
    name: linux-${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 每一格都把 audio/audiodevice 写全：GitHub Actions 的表达式里没有 `||` 兜底，
          # 缺字段会展开成空串、直接当非法参数传给 cmake。
          - name: bundled            # 默认：内嵌 lzma/zstd（FetchContent）
            archive: ON
            bundle: ON
            assetzip: ON
            audio: ON
            audiodevice: OFF
            render: OFF
          - name: no-archive         # PLAN.md §5：OFF 时不该需要压缩库，且前缀干净
            archive: OFF
            bundle: ON
            assetzip: ON
            audio: ON
            audiodevice: OFF
            render: OFF
          - name: system-deps        # 用系统库（liblzma / libzstd 的 CMake config）
            archive: ON
            bundle: OFF
            assetzip: ON
            audio: ON
            audiodevice: OFF
            render: OFF
          - name: no-asset-zip       # 资产 zip 真的可关（上游 dc89c14 加了条件编译）
            archive: ON
            bundle: ON
            assetzip: OFF
            audio: ON
            audiodevice: OFF
            render: OFF
          - name: no-audio           # 打拍音合成可关（headless 仍能跑，只是退回合成点击音）
            archive: ON
            bundle: ON
            assetzip: ON
            audio: OFF
            audiodevice: OFF
            render: OFF
          - name: all-modules        # 全开：连设备播放那条线（miniaudio + stb）也要能编
            archive: ON
            bundle: ON
            assetzip: ON
            audio: ON
            audiodevice: ON
            render: OFF
          - name: render-on          # render=ON：引入 glad + GLFW + 平台 GL（绕不开）
            archive: ON
            bundle: ON
            assetzip: ON
            audio: ON
            audiodevice: OFF
            render: ON
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            liblzma-dev libzstd-dev
          # render=ON 才需要：GLFW 在 Linux 上要 X11/Wayland 的头（不装会配置失败）
          if [ "${{ matrix.render }}" = "ON" ]; then
            sudo apt-get install -y libwayland-dev libxkbcommon-dev libgl-dev \
              libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
          fi

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DADOFAI_LIB_ARCHIVE=${{ matrix.archive }} \
            -DADOFAI_LIB_BUNDLE_DEPS=${{ matrix.bundle }} \
            -DADOFAI_LIB_ASSET_ZIP=${{ matrix.assetzip }} \
            -DADOFAI_LIB_AUDIO=${{ matrix.audio }} \
            -DADOFAI_LIB_AUDIO_DEVICE=${{ matrix.audiodevice }} \
            -DADOFAI_LIB_RENDER=${{ matrix.render }}

      - name: Build
        run: cmake --build build --parallel

      - name: Tests
        run: ctest --test-dir build --output-on-failure

      # geom_probe（GPU 逐位那一层）在没有显示/驱动时会打印 SKIP 并退 0 —— 那是**真话**，
      # 但会让 CI 绿得没有意义。这一步把它到底是"跑了"还是"跳过了"查清楚并明确报告。
      - name: Report whether the GPU bitwise layer actually ran
        if: matrix.render == 'ON'
        run: |
          set +e
          ./build/tests/adofai_geom_probe_test tests/charts/angles360.adofai \
              tests/charts/shapes_exhaustive.adofai 2>&1 | tee /tmp/geom.log
          set -e
          if grep -q "SKIP" /tmp/geom.log; then
            echo "::warning title=geom_probe skipped::Ubuntu runner 没有 GL 上下文 → GPU 逐位这一层没跑。它仍需在带显示/驱动的机器上验（macOS 那格跑了，本地也跑过）。"
          else
            echo "GPU 逐位那一层真的跑了："
            grep -E "逐位|坐标|最大偏差" /tmp/geom.log | tail -3
          fi

      # 消费者验收（PLAN.md §6）：install 之后另建一个工程 find_package 编一遍。
      # 只在默认配置这一格做，避免重复。
      - name: Consumer smoke (install + find_package)
        if: matrix.name == 'bundled'
        run: |
          ctest --test-dir build -R level_parse_parity --output-on-failure
          cmake --install build --prefix "$RUNNER_TEMP/prefix"
          mkdir -p consumer && cd consumer
          # 消费者自备 RapidJSON（本库只 include 它的头，且它没有可用的 CMake config；
          # 见 README 的"公共依赖"）。用本库构建时 Populate 下来的那份，省一次下载。
          RAPIDJSON_INC="$GITHUB_WORKSPACE/build/_deps/rapidjson-src/include"
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(consumer LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          find_package(ADOFAI.Lib CONFIG REQUIRED)
          add_executable(app main.cpp)
          target_link_libraries(app PRIVATE ADOFAI::archive)
          if(TARGET ADOFAI::render)
            message(FATAL_ERROR "render=OFF 却存在 ADOFAI::render")
          endif()
          EOF
          cat > main.cpp <<'EOF'
          #include <cstdio>
          #include "archive/Install.hpp"
          #include "core/level/LevelData.hpp"
          #include "core/timeline/Timeline.hpp"
          int main(int argc, char** argv) {
              if (argc < 2) return 2;
              adofai::archive::install();
              adofai::LevelData level;
              if (!level.loadFromFile(argv[1])) { std::fprintf(stderr, "load failed\n"); return 1; }
              adofai::Timeline tl; tl.build(level, true);
              std::printf("consumer ok: tiles=%zu\n", level.tiles.size());
              return 0;
          }
          EOF
          cmake -B build -G Ninja -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/prefix" \
                -DCMAKE_CXX_FLAGS="-I$RAPIDJSON_INC"
          cmake --build build --parallel
          # 明文谱能读；顺便验 add_subdirectory 兜底路径
          ./build/app "$GITHUB_WORKSPACE/tests/data/smoke_level.adofai"

      - name: Consumer smoke (add_subdirectory)
        if: matrix.name == 'bundled'
        run: |
          mkdir -p consumer-sub && cd consumer-sub
          cat > CMakeLists.txt <<EOF
          cmake_minimum_required(VERSION 3.20)
          project(consumer_sub LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          add_subdirectory("$GITHUB_WORKSPACE" adofai_lib)
          add_executable(app main.cpp)
          target_link_libraries(app PRIVATE ADOFAI::core)
          if(TARGET ADOFAI::render)
            message(FATAL_ERROR "render=OFF 却存在 ADOFAI::render")
          endif()
          EOF
          cat > main.cpp <<'EOF'
          #include <cstdio>
          #include "core/level/LevelData.hpp"
          #include "core/timeline/Timeline.hpp"
          int main(int argc, char** argv) {
              if (argc < 2) return 2;
              adofai::LevelData level;
              if (!level.loadFromFile(argv[1])) { std::fprintf(stderr, "load failed\n"); return 1; }
              adofai::Timeline tl; tl.build(level, true);
              std::printf("consumer(subdir) ok: tiles=%zu\n", level.tiles.size());
              return 0;
          }
          EOF
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ./build/app "$GITHUB_WORKSPACE/tests/data/smoke_level.adofai"

  macOS:
    # 这一格开 render：只有它会真的建 GL 上下文，所以 GPU 逐位那一层（geom_probe）
    # **只有在这儿才可能真跑** —— Ubuntu runner 上 glfwInit 会失败并打印 SKIP
    # （见 linux 的 "Report whether the GPU bitwise layer actually ran" 那一步）。
    name: macOS-render-on
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Install dependencies
        run: brew install ninja

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DADOFAI_LIB_RENDER=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Tests
        run: ctest --test-dir build --output-on-failure

      # 明确报告 GPU 那一层到底跑没跑（与 linux 那格同一个理由：SKIP 退 0 不等于验过）。
      - name: Report whether the GPU bitwise layer actually ran
        run: |
          set +e
          ./build/tests/adofai_geom_probe_test tests/charts/angles360.adofai \
              tests/charts/shapes_exhaustive.adofai 2>&1 | tee /tmp/geom.log
          set -e
          if grep -q "SKIP" /tmp/geom.log; then
            echo "::warning title=geom_probe skipped::macOS runner 上也没拿到 GL 上下文。"
          else
            echo "GPU 逐位那一层真的跑了："
            grep -E "逐位|坐标|最大偏差" /tmp/geom.log | tail -3
          fi

      # 系统库那条路在 macOS 上也该能走通（brew 的 zstd 带 CMake config，
      # liblzma 走 CMake 自带的 Find 模块）。
      - name: Configure + build (system deps)
        run: |
          cmake -B build-sys -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DADOFAI_LIB_BUNDLE_DEPS=OFF
          cmake --build build-sys --parallel
          ctest --test-dir build-sys --output-on-failure

  windows:
    name: windows-default
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            git

      - name: Configure
        shell: msys2 {0}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Tests
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure
